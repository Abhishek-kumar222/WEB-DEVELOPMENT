<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="simon-says-game.css">
</head>
<body>
    <h1>Simon says Game</h1>
    <h3>Press any key to start Game</h3>
    <div id="main">
        <div class="lineOne">
             <div class="innerDiv red" id="red" type ="button">1</div>
            <div class="innerDiv green" id="green" type ="button">2</div>
        </div>
        <div class="lineTwo">
            <div class="innerDiv yellow" id="yellow" type ="button">3</div>
            <div class="innerDiv purple" id="purple" type ="button">4</div>
        </div>
        
    </div>
    <script src="simon-says-game.js"></script>
</body>
</html>
